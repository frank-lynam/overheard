[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "overheard"
dynamic = ["version"]
description = "An AI voicemail console that catches what busy humans miss: one day of a fictional call center's voicemail, through four levels of AI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Frank Lynam" }]
keywords = ["ai", "llm", "voicemail", "call-center", "demo"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "anthropic>=2.6",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=2.6"]   # Claude on Amazon Bedrock: the AWS credential chain
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "build>=1.2"]

[project.scripts]
overheard = "overheard.cli:main"

[project.urls]
Homepage = "https://github.com/frank-lynam/overheard"

[tool.hatch.version]
path = "src/overheard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/overheard"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# data tables and the hand-written scripts read better one entry per line
"src/overheard/data/templates.py" = ["E501"]
"src/overheard/data/events.py" = ["E501"]
"src/overheard/data/generator.py" = ["E501"]
"tools/build_seed_today.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
