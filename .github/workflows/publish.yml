# Publishing uses PyPI trusted publishing (no tokens stored), the same as hobkin:
#   - publishing a GitHub release (tag vX.Y.Z, matching overheard.__version__) uploads to PyPI
#   - running this workflow by hand (Actions -> Publish -> Run workflow) uploads to TestPyPI, for a dry run
# PyPI needs a (pending) publisher: project overheard, repository frank-lynam/overheard, workflow publish.yml,
# environment pypi. (TestPyPI, only for the dry run: the same, with environment testpypi.)
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: The release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import overheard; print(overheard.__version__)')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match overheard.__version__ $version"; exit 1
          fi
      - run: python -m build
      - run: python -m pip install twine && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/overheard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/overheard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
