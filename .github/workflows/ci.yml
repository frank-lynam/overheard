name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false    # one version failing shouldn't hide what the others say
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee test-output.txt || {
            # The step log needs a GitHub login; annotations are public. On a failure, every failing line (FAIL,
            # FAILED, ERROR), then the end of the output, go in one.
            { grep -E '^(FAIL|ERROR)' test-output.txt | head -n 30; echo ...; tail -n 40 test-output.txt; } | python3 -c "import sys; t = sys.stdin.read(); print('::error title=Tests failed::' + t.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A'))"
            exit 1
          }
